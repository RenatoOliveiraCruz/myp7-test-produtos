<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Produtos</title>
</head>
<body>
<h1>Produtos</h1>

<h2>Cadastrar produto</h2>
<form id="form-produto">
    <input type="text" id="descricao" placeholder="Descrição" maxlength="45" required>
    <input type="text" id="codigoFabricante" placeholder="Código do fabricante" maxlength="45">
    <button type="submit">Salvar</button>
</form>

<h2>Lista de produtos</h2>
<input type="text" id="busca" placeholder="Buscar por descrição">
<button id="btn-buscar">Buscar</button>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Descrição</th>
        <th>Código fabricante</th>
    </tr>
    </thead>
    <tbody id="lista"></tbody>
</table>

<script src="script.js"></script>
</body>
</html>
